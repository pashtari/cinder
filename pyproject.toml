[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinder"
version = "0.1.0"
description = "PyTorch implementation of CINDER - conditional INR for dense prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pooya Ashtari", email = "pooya.ash@gmail.com"},
]
keywords = [
    "neural fields",
    "implicit neural representations",
    "INR",
    "dense prediction",
    "segmentation",
    "pytorch",
    "deep learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # torch 2.1: torch.optim.lr_scheduler.LRScheduler, and the Triton 2.1 that
    # ships with it for tl.static_range in cinder.models.rcs_matrix.
    "torch>=2.1.0",
    # torchvision 0.16: tv_tensors (renamed from datapoints) + stable transforms.v2.
    "torchvision>=0.16.0",
    "timm>=1.0.0",
    # Imported by cinder.engine, which `import cinder` pulls in -- not optional.
    # <0.6: cinder.handlers.tensorboard uses ignite.contrib, removed in 0.6.0.
    "pytorch-ignite>=0.5.0,<0.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# Only cinder.engine.train / cinder.engine.eval and cinder.handlers need these.
train = [
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "hydra-colorlog>=1.2.0",
    "tensorboard>=2.14.0",
]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/pashtari/cinder"
Repository = "https://github.com/pashtari/cinder"

[tool.setuptools.packages.find]
include = ["cinder*"]