[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinder"
version = "0.1.0"
description = "PyTorch implementation of CINDER - conditional INR for dense prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pooya Ashtari", email = "pooya.ash@gmail.com"},
]
keywords = [
    "neural fields",
    "implicit neural representations",
    "INR",
    "dense prediction",
    "segmentation",
    "pytorch",
    "deep learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "neurofield @ git+https://github.com/pashtari/neurofield.git",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "opt_einsum>=3.3.0",
    "timm>=1.0.0",
    "scipy>=1.10.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
train = [
    "pytorch-ignite>=0.5.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "hydra-colorlog>=1.2.0",
    "tensorboard>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/pashtari/cinder"
Repository = "https://github.com/pashtari/cinder"

[tool.setuptools.packages.find]
include = ["cinder*"]