[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinder"
dynamic = ["version"]
description = "CINDER: Conditioned Implicit Neural DecodeR for dense prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pooya Ashtari", email = "pooya.ash@gmail.com"},
]
keywords = [
    "neural fields",
    "implicit neural representations",
    "INR",
    "dense prediction",
    "segmentation",
    "pytorch",
    "deep learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # PyTorch 2.1 provides LRScheduler and the Triton kernels used by RCSMatrix.
    "torch>=2.1.0",
    # torchvision 0.16 provides tv_tensors and transforms.v2.
    "torchvision>=0.16.0",
    # timm 1.0.20 provides the default DINOv3 ConvNeXt encoder.
    "timm>=1.0.20",
    "pytorch-ignite>=0.5.0,<0.6",
    # Registers the ${frac:} resolver used by the configs.
    "omegaconf>=2.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# Training and evaluation entrypoints.
train = [
    "hydra-core>=1.3.0",
    "hydra-colorlog>=1.2.0",
    "tensorboard>=2.14.0",
]
# The config tests build models through Hydra.
test = ["pytest>=7.0", "cinder[train]"]

[project.urls]
Homepage = "https://github.com/pashtari/cinder"
Repository = "https://github.com/pashtari/cinder"

[tool.setuptools.dynamic]
version = {attr = "cinder.__version__"}

[tool.setuptools.packages.find]
include = ["cinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
# Ported (inrs.py) and kernel (rcs_matrix.py) code keeps its upstream formatting.
exclude = ["cinder/models/inrs.py", "cinder/models/rcs_matrix.py"]
