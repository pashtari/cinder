# Shared by model/*.yaml, which choose the INR and the modulator.
_target_: cinder.CINDER
in_channels: 3
out_channels: ${dataset.num_classes}
in_size: ${dataset.crop_size}
freeze_encoder: false
# Fraction of pixel coordinates decoded per training step.
sampling_ratio: 1.0

encoder:
    _target_: cinder.TimmEncoder
    _partial_: true
    model_name: convnext_tiny.dinov3_lvd1689m # vit_small_patch16_dinov3.lvd1689m
    pretrained: true
    # A LayerNorm on each output map.
    normalize: true
    out_indices: [-1]
    # Fixed-size transformers also need +model.encoder.img_size=${dataset.crop_size}.

inr:
    _target_: ???
    _partial_: true

# A modulator, or cinder.ListModulators with `modulators` listed innermost first.
# CINDER passes it the INR and the sizes.
modulator:
    _target_: ???
    _partial_: true
