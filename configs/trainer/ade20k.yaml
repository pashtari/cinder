defaults:
    - default

# The mmsegmentation schedule: 160k iterations at a global batch of 16, evaluated
# every 16k, with a 1500-iteration warmup.
max_iters: 160000
eval_interval: 16000
warmup_iters: 1500
# Scoring all 20210 training images would dwarf the validation pass.
eval_train_ratio: 0.05

loss:
    _target_: cinder.MaskedCrossEntropyLoss
    ignore_index: 0
