# Budgets count optimizer steps, independent of dataset and batch size.
max_iters: 20000
# Iterations between evaluations and checkpoints; must divide max_iters.
eval_interval: 2000
# Iterations between console and TensorBoard progress points.
log_interval: 50
# Fraction of the training set also scored at each evaluation; 0 disables it.
eval_train_ratio: 1.0

lr: 1e-4
weight_decay: 0.01
# Linear warmup over 1% of the budget; ${frac:} is registered in cinder.engine.
warmup_iters: ${frac:${trainer.max_iters},0.01}
warmup_start_lr: 1e-6

amp: true
non_blocking: true
find_unused_parameters: true
# Applied only with several processes, so multi-GPU runs match single-GPU ones.
sync_bn: true

loss:
    _target_: torch.nn.BCEWithLogitsLoss

optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: ${trainer.lr}
    weight_decay: ${trainer.weight_decay}

lr_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: ${trainer.max_iters}
    eta_min: 0.0
