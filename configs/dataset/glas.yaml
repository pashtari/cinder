defaults:
    - default

num_classes: 1
# The *_anno.bmp masks label each gland separately.
instance_labels: true
# Validation split: test (A and B together), testA or testB.
test_split: test

train_datalist:
    _target_: cinder.datasets.glas.create_datalist
    root: ${path.dataset_dir}
    split: train

val_datalist:
    _target_: cinder.datasets.glas.create_datalist
    root: ${path.dataset_dir}
    split: ${dataset.test_split}
