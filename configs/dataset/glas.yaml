defaults:
    - default

num_classes: 1

# The *_anno.bmp files label each gland separately, which the object-level
# metrics need and pixel metrics ignore.
instance_labels: true

test_section: test # testA or testB

train_datalist:
    _target_: cinder.datasets.glas.create_datalist
    root: ${path.dataset_dir}
    section: train

val_datalist:
    _target_: cinder.datasets.glas.create_datalist
    root: ${path.dataset_dir}
    section: ${dataset.test_section}
