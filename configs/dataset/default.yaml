# GLOBAL batch size, shared by every dataset: ignite.distributed.auto_dataloader
# divides it by world size, so 16 is 8 per GPU on two GPUs. Holding it fixed is
# what makes the per-dataset iteration budgets mean the same thing, and matches
# the ADE20K convention every published baseline is trained under.
batch_size: 16

# Must stay 1. val_transform is null, so validation images keep their native
# sizes -- GlaS has 5 distinct sizes across 80 images, ADE20K 182 across 2000 --
# and the default collate cannot stack tensors of differing shape. Evaluation is
# batched instead by the sliding-window inferer's sw_batch_size, which batches
# windows within a single image and so is size-agnostic.
val_batch_size: 1

num_workers: 16

crop_size: [512, 512]

train_transform:
    _target_: torchvision.transforms.v2.Compose
    transforms:
        - _target_: torchvision.transforms.v2.RandomCrop
          size: ${dataset.crop_size}
          pad_if_needed: true
        - _target_: torchvision.transforms.v2.RandomHorizontalFlip
          p: 0.5
        - _target_: torchvision.transforms.v2.RandomApply
          p: 0.5
          transforms:
              - _target_: torchvision.transforms.v2.RandomRotation
                degrees: 15
        - _target_: torchvision.transforms.v2.RandomApply
          p: 0.5
          transforms:
              - _target_: torchvision.transforms.v2.ColorJitter
                brightness: 0.2
                contrast: 0.2
                saturation: 0.2

val_transform: null

# Keep the annotation's per-object labels on the *validation* set, for the
# object-level metrics. Pixel metrics threshold the target themselves, so this
# is inert for them; training is unaffected either way, since it builds
# train_set. Datasets whose annotations number each object set this to true.
instance_labels: false

# datasets
train_set:
    _target_: cinder.SegmentationDataset
    datalist: ${dataset.train_datalist}
    transform: ${dataset.train_transform}
    num_classes: ${dataset.num_classes}

val_set:
    _target_: cinder.SegmentationDataset
    datalist: ${dataset.val_datalist}
    transform: ${dataset.val_transform}
    num_classes: ${dataset.num_classes}
    instance_labels: ${dataset.instance_labels}

# dataloaders
train_loader:
    _target_: ignite.distributed.auto_dataloader
    dataset: ${dataset.train_set}
    batch_size: ${dataset.batch_size}
    num_workers: ${dataset.num_workers}
    pin_memory: true
    shuffle: true
    drop_last: true

val_loader:
    _target_: ignite.distributed.auto_dataloader
    dataset: ${dataset.val_set}
    batch_size: ${dataset.val_batch_size}
    num_workers: ${dataset.num_workers}
    pin_memory: true
    shuffle: false
