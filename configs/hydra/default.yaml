# https://hydra.cc/docs/configure_hydra/intro/

defaults:
    - override hydra_logging: colorlog
    - override job_logging: colorlog

run:
    dir: ${path.log_dir}/${hydra:runtime.choices.dataset}/${tag}/${hydra:runtime.choices.model}/${now:%Y-%m-%d_%H-%M-%S}

sweep:
    dir: ${path.log_dir}/${hydra:runtime.choices.dataset}/${tag}/${hydra:runtime.choices.model}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

job_logging:
    handlers:
        file:
            filename: ${hydra.runtime.output_dir}/${phase}.log
